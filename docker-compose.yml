volumes:
  linklik_data:

services:
  linklik:
    image: ghcr.io/benyigiteren/linklik:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linklik-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - linklik_data:/app/data
    environment:
      - PORT=8080
      - DB_PATH=/app/data/linklik.db
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET zorunlu, en az 32 karakter olmali}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"